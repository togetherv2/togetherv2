<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Together</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap">
<style>
:root{--ui:rgba(255,252,246,.93);--ink:#2b2540;--accent:#6a58e0;--sh:rgba(60,40,30,.3);--dim:transparent;--wood:#8a5a35;--mw:clamp(88px,27vw,132px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui:rgba(36,28,58,.93);--ink:#f3ebff;--accent:#9b8cff;--dim:rgba(22,12,50,.5)}}
:root[data-theme="dark"]{--ui:rgba(36,28,58,.93);--ink:#f3ebff;--accent:#9b8cff;--dim:rgba(22,12,50,.5)}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:#8fb3a1;font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
#app{position:relative;height:100%;overflow:hidden}
#room{position:absolute;inset:0;z-index:0;background:linear-gradient(#b3cfbf 0 60%,#7fa593 60% 63%,#8fb3a1 63%)}
#room::after{content:"";position:absolute;inset:0;background:var(--dim)}
#room i{position:absolute;display:block}
.wn{right:7%;top:31%;width:27%;height:19%;border:6px solid #f4eee2;border-radius:6px;background:linear-gradient(#8fd0ee,#e8f6ff)}
.wn::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:#f4eee2}
.pa,.pb2{left:21%;border:4px solid var(--wood)}
.pa{top:35%;width:12%;height:9%;background:linear-gradient(135deg,#f2c46d,#d9694a)}
.pb2{top:46%;width:8%;height:6%;background:linear-gradient(135deg,#7fb8d8,#3f7ea6)}
.lp{right:5%;top:56%;width:6px;height:24%;background:#5b4630}
.lp::before{content:"";position:absolute;left:-16px;top:-16px;width:38px;height:28px;border-radius:6px 6px 14px 14px;background:#f6d98a;box-shadow:0 0 34px 10px rgba(255,214,120,.55)}
.sf{left:2%;right:2%;bottom:-2%;height:34%;border-radius:28px 28px 0 0;background:#e0a93b;box-shadow:inset 0 16px 0 #ecbc55}
.sf::before,.sf::after{content:"";position:absolute;top:-8%;bottom:0;width:12%;border-radius:20px 20px 0 0;background:#cf952a}
.sf::before{left:-1%}.sf::after{right:-1%}
canvas{display:block}
#c{position:absolute;inset:0;width:100%;height:100%;z-index:2}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.pop{position:absolute;font-size:26px;animation:rise 2.1s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1}to{opacity:0;transform:translate(-50%,-80px) scale(1.2)}}
.top{position:absolute;top:10px;z-index:6;border:0;background:var(--ui);color:var(--ink);box-shadow:0 5px 14px var(--sh);font-size:20px;display:grid;place-items:center;cursor:pointer;padding:0}
#pb{left:10px;width:44px;height:44px;border-radius:12px}
#lb{left:40%;width:44px;height:44px;border-radius:50%;transform:translateX(-50%)}
#lb.on{background:var(--accent);color:#fff}
#gd{left:calc(40% + 30px);width:30px;height:30px;border-radius:50%;background:#2ecc71;display:none;top:17px;animation:pl 1.6s infinite;--c:rgba(46,204,113,.4)}
#gd.on{display:block}
#mirw{position:absolute;top:10px;right:10px;width:var(--mw);z-index:6;text-align:center}
#mir{position:relative;width:var(--mw);height:var(--mw);box-sizing:border-box;border-radius:50%;border:5px solid var(--wood);overflow:hidden;box-shadow:0 6px 16px var(--sh);background:radial-gradient(circle at 35% 30%,#e3f3ec,#9fc3b6)}
#mir canvas{width:100%;height:100%;transform:scaleX(-1)}
#mir::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.35),transparent 40%);pointer-events:none}
#mn,#pn{display:inline-block;margin-top:4px;padding:1px 10px;border-radius:12px;background:var(--ui);font-weight:700;font-size:13px;box-shadow:0 2px 6px var(--sh);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pn{position:absolute;z-index:4;margin:0;transform:translate(-50%,-50%);pointer-events:none}
#dock{position:absolute;left:10px;top:27%;display:flex;flex-direction:column;gap:10px;z-index:6}
#dock button{--d:clamp(46px,8vh,58px);width:var(--d);height:var(--d);border-radius:50%;border:0;background:var(--ui);color:var(--ink);box-shadow:0 6px 16px var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:10px;line-height:1;cursor:pointer;animation:fl 3.2s ease-in-out infinite;transition:background .2s,color .2s}
#dock button span{font-size:20px;margin-bottom:2px}
#dock button:nth-child(2){animation-delay:-.8s}#dock button:nth-child(3){animation-delay:-1.6s}#dock button:nth-child(4){animation-delay:-2.4s}
#dock button.on{background:var(--accent);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@keyframes fl{50%{transform:translateY(-4px)}}
@keyframes pl{50%{box-shadow:0 0 0 9px var(--c,rgba(229,56,79,.25))}}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:46%;overflow-y:auto;background:var(--ui);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px 24px 0 0;padding:14px 16px 18px;box-shadow:0 -8px 24px var(--sh);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:5}
#sheet.open{transform:none}
#sheet h3{margin:0 0 8px;font-size:17px}
.r{display:grid;grid-template-columns:112px 1fr;align-items:center;gap:8px;margin:6px 0;font-weight:700;font-size:15px}
.r small{display:block;font-weight:500;opacity:.65;font-size:11px}
input[type=range]{width:100%;accent-color:var(--accent)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}

.chip{border:0;border-radius:16px;padding:9px 6px;background:rgba(106,88,224,.14);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.g.q .chip{flex-direction:row;justify-content:flex-start;gap:8px;padding:11px 12px;text-align:left}
.chip span{font-size:24px}
.chip.on{background:var(--accent);color:#fff}
.nm{display:flex;gap:8px}
.nm input{flex:1;min-width:0;border:2px solid rgba(106,88,224,.3);border-radius:14px;padding:8px 12px;font-size:16px;background:transparent;color:var(--ink)}
.seg{display:flex;gap:4px}.seg .chip{padding:6px 12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tabs .chip{padding:5px 11px;font-size:13px}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opts .chip{font-size:11px;padding:8px 2px;min-height:58px;justify-content:center}
.sw{display:block;width:24px;height:24px;border-radius:50%;border:2px solid rgba(0,0,0,.2)}
#chat{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 12px 12px;pointer-events:none}
#msgs{display:flex;flex-direction:column;gap:6px;margin-bottom:13vh;transition:margin .3s}
#chat.open #msgs{margin-bottom:10px}
.b{pointer-events:auto;background:var(--ui);padding:8px 14px;max-width:78%;font-weight:500;font-size:15px;box-shadow:0 3px 10px var(--sh);display:flex;align-items:center;gap:8px;width:fit-content}
.b.me{align-self:flex-end;border-radius:18px 18px 4px 18px}
.b.pt{align-self:flex-start;border-radius:18px 18px 18px 4px;margin-left:68px;border-left:4px solid var(--accent)}
.b button{border:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px}
.wv{width:70px;height:14px;border-radius:7px;background:repeating-linear-gradient(90deg,var(--accent) 0 3px,transparent 3px 6px);opacity:.6}
#bar{display:none;gap:8px;pointer-events:auto}
#chat.open #bar{display:flex}
#in{flex:1;min-width:0;border:0;border-radius:24px;padding:12px 16px;font-size:16px;background:var(--ui);color:var(--ink);box-shadow:0 3px 10px var(--sh)}
#bar button{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:19px;flex:none}
#mic.rec{background:#e5384f;animation:pl 1s infinite}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-250%);background:var(--ink);color:var(--ui);padding:10px 16px;border-radius:14px;font-size:14px;max-width:86%;text-align:center;transition:transform .3s;z-index:9}
#toast.on{transform:translate(-50%,0)}
#bus{position:absolute;inset:0;z-index:1;transform:translateX(105%);background:#f2b53c}
#bus.on{transform:none;transition:transform 1.3s cubic-bezier(.2,.8,.2,1)}
#bus.out{transform:translateX(-105%);transition:transform 1.3s ease-in}
#bus .win{position:absolute;left:6%;right:6%;top:6%;height:44%;border:8px solid #5b4630;border-radius:18px;background:linear-gradient(#bfe6ff,#fff1d6);overflow:hidden}
#bus .scn{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#8aa0c6 0 40px,#6c86b3 40px 92px,transparent 92px 140px) 0 100%/auto 60% no-repeat}
#bus.ride .scn,#bus.out .scn{animation:sc .9s linear infinite}
@keyframes sc{to{background-position:-140px 100%}}
#map{position:absolute;inset:0;z-index:8;background:rgba(20,16,30,.55);display:none;place-items:center}
#map.on{display:grid}
.mc{width:min(92%,400px);background:var(--ui);border-radius:24px;padding:14px;box-shadow:0 10px 30px var(--sh)}
.mc h3{margin:0 0 8px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.mc h3 button{border:0;background:rgba(106,88,224,.14);color:var(--ink);border-radius:50%;width:32px;height:32px;font-size:16px}
#rd{position:relative;aspect-ratio:1;width:min(100%,52vh);margin:0 auto;border-radius:20px;overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(0,0,0,.06) 31px 32px),repeating-linear-gradient(90deg,transparent 0 31px,rgba(0,0,0,.06) 31px 32px),#bfdcc7}
.ring{position:absolute;border:2px dashed rgba(0,0,0,.25);border-radius:50%}
.rl{position:absolute;font-size:10px;font-style:normal;font-weight:700;transform:translate(-50%,-110%);opacity:.7;color:#2b2540}
.av{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 3px 8px rgba(0,0,0,.3);background:linear-gradient(var(--h) 0 42%,var(--s) 42%)}
.av b{position:absolute;right:-8px;bottom:-8px;font-size:16px}
#mi{margin:10px 0 8px;font-weight:700;text-align:center}
#gm{display:block;text-align:center;background:var(--accent);color:#fff;border-radius:16px;padding:10px;font-weight:700;text-decoration:none}
@media (prefers-reduced-motion:reduce){#dock button,#gd,#bus .scn{animation:none!important}}
</style>

<body>
<div id="app">
  <div id="room"><i class="wn"></i><i class="pa"></i><i class="pb2"></i><i class="lp"></i><i class="sf"></i></div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== SETTINGS: paste your Apps Script web app URL here (ends with /exec). Leave empty for demo mode. ===== */
const BACKEND_URL="https://script.google.com/macros/s/AKfycbxa-UboBcXCP0ojyTD1d6iFozsXLJFqnI6tkcf0fM0jNusPNOHWQaM3wyeJquqZIYckWw/exec",ROOM="our-room";

const $=s=>document.querySelector(s),lerp=(a,b,k)=>a+(b-a)*k;
const MOODS={happy:{smile:1,brow:.25,lid:0,blush:.35,green:0,red:0},neutral:{smile:.2,brow:0,lid:0,blush:0,green:0,red:0},love:{smile:.8,brow:.2,lid:0,blush:1,green:0,red:0},frustrated:{smile:-.9,brow:-1,lid:.15,blush:0,green:0,red:1},annoyed:{smile:-.15,brow:-.5,lid:.5,blush:0,green:0,red:0},sad:{smile:-1,brow:1,lid:.25,blush:.1,green:0,red:0},sick:{smile:-.4,brow:.5,lid:.4,blush:0,green:1,red:0}};
const MOOD_UI=[["happy","😊","Happy"],["neutral","😐","Neutral"],["love","😍","Love"],["frustrated","😤","Frustrated"],["annoyed","😒","Annoyed"],["sad","😢","Sad"],["sick","🤒","Sick"]];
const QUICK=[{i:"🎮",l:"Let’s play a game!",pose:"game"},{i:"🍽️",l:"Let’s eat!",pose:"eat"},{i:"🚌",l:"I’m going home",pose:"bus"},{i:"👋",l:"Hi!",pose:"wave"},{i:"💕",l:"I miss you",pose:"heart"},{i:"😴",l:"Good night",pose:"sleep"}];
const STATS=[["hunger","🍔","Hunger","full → starving"],["energy","🔋","Energy","drained → fresh"],["turbo","🎮","Game turbo","chill → hyped"],["talk","💬","Talk","quiet → chatty"]];
const OPT={
shirt:[["Blue tee",0x6b8bff,0],["Red stripes",0xe5484d,1],["Green hoodie",0x3fae6a,2],["Black tee",0x2d2d38,0],["Gold hoodie",0xf2b632,2]],
hair:[["Short",0x4a3028],["Spiky",0x1f1a1a],["Afro",0x2b1d1d],["Mop",0xd9a441],["Buzz",0x8a4b2a]],
face:[["Round",[1,1.05,.95]],["Long",[.9,1.18,.95]],["Wide",[1.12,.97,.95]],["Square",[1.05,1,1]],["Small",[.93,.98,.9]]],

eyes:[["Brown",0x5a3a22,.06],["Blue",0x3a7bd5,.06],["Green",0x3a9a5a,.07],["Gray",0x7b8794,.05],["Black",0x14121a,.075]],
nose:[["Small",[.7,.7,.7]],["Big",[1.3,1.3,1.3]],["Pointy",[.8,1.2,1.5]],["Wide",[1.6,.9,1]],["Button",[.5,.5,.5]]],
lips:[["Thin",0x9a4a4a,.012,1],["Full",0xd9647a,.027,1],["Red",0xc0303f,.02,1],["Wide",0x8a4040,.018,1.35],["Small",0xb8636d,.016,.7]]};
const LBL={shirt:"Shirt",hair:"Hair",face:"Face",build:"Body",skin:"Skin",eyes:"Eyes",nose:"Nose",lips:"Lips"};
const POSES={idle:[[.05,.12,-.1],[.05,.12,-.1]],game:[[-.7,-.45,-1.5],[-.7,-.45,-1.5]],eat:[[-.35,-.5,-1],[-1.1,-.3,-1.2]],wave:[[.05,.12,-.1],[0,2.5,-.3]],heart:[[-.5,-.5,-2],[-.5,-.5,-2]],sleep:[[.05,.12,-.1],[-1.4,-.45,-1.5]],bus:[[.05,.12,-.1],[0,3,0]]};
const GR=new THREE.Color(0xa6d18a),RD=new THREE.Color(0xf08a78),V=new THREE.Vector3(),V2=new THREE.Vector3();

/* ---------- state ---------- */
const NEU={hunger:30,energy:80,turbo:50,talk:60,mood:"neutral"};
const my={name:"Player 1",cfg:{shirt:0,hair:0,face:0,build:1,skin:1,eyes:0,nose:0,lips:0},S:{...NEU},act:null,loc:null,out:[]};
const pt={name:"",cfg:{shirt:1,hair:1,face:3,build:2,skin:2,eyes:1,nose:2,lips:1},S:{...NEU},loc:null,online:!BACKEND_URL,rx:0,actTs:null,lastId:null,first:true};
let slot=1,demo=!BACKEND_URL,dirty=false,watch=null,cur=null,cat="shirt";
try{const d=JSON.parse(localStorage.getItem("tg1")||"{}");if(d.name)my.name=d.name;if(d.cfg)Object.assign(my.cfg,d.cfg);if(d.slot)slot=d.slot}catch(e){}
pt.name=BACKEND_URL?"Player "+(3-slot):"Demo buddy";
const save=()=>{try{localStorage.setItem("tg1",JSON.stringify({name:my.name,cfg:my.cfg,slot}))}catch(e){}};
const log=[],pose=["idle","idle"],tm=[];

/* ---------- 3D ---------- */
function stage(cv,fov){const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));const sc=new THREE.Scene();
sc.add(new THREE.HemisphereLight(0xffffff,0xffe0c8,.95));const d=new THREE.DirectionalLight(0xffffff,.75);d.position.set(2,3,4);sc.add(d);
return{R,sc,cam:new THREE.PerspectiveCamera(fov,1,.1,60),cv,W:1,H:1}}
const main=stage($("#c"),32),mirS=stage($("#mc"),34);
function fit(){for(const s of[main,mirS]){const p=s.cv.parentElement;s.W=p.clientWidth||1;s.H=p.clientHeight||1;s.R.setSize(s.W,s.H,false);s.cam.aspect=s.W/s.H}
const t=Math.tan(main.cam.fov*Math.PI/360),d=Math.max(1.8/t,1.4/(main.cam.aspect*t));
main.cam.position.set(0,.9,d);main.cam.lookAt(0,.6,0);main.cam.updateProjectionMatrix();
mirS.cam.position.set(0,1.25,4.2);mirS.cam.lookAt(0,1,0);mirS.cam.updateProjectionMatrix()}
addEventListener("resize",fit);
function scr(st,o,dx,dy){o.getWorldPosition(V);V.x+=dx||0;V.y+=dy||0;V.project(st.cam);return[(V.x+1)/2*st.W,(1-V.y)/2*st.H]}
function pop(t,xy,j){const e=document.createElement("span");e.className="pop";e.textContent=t;e.style.left=xy[0]+(j?(Math.random()-.5)*j:0)+"px";e.style.top=xy[1]+"px";$("#fx").appendChild(e);setTimeout(()=>e.remove(),2200)}

function makeChar(st,fxOn){
const g=new THREE.Group();st.sc.add(g);
const M=c=>new THREE.MeshLambertMaterial({color:c}),mk=(geo,m,x,y,z,p)=>{const o=new THREE.Mesh(geo,m);o.position.set(x||0,y||0,z||0);(p||g).add(o);return o};
const skin=M(0xf2c4a0),shirt=M(0x6b8bff),hairM=M(0x4a3028),white=M(0xffffff),dark=M(0x2b1d1d),pup=M(0x5a3a22),noseM=M(0xe8a88a),lipM=M(0x9a4a4a),SK=new THREE.Color(),eyeCol=new THREE.Color();
const cheekM=new THREE.MeshLambertMaterial({color:0xff6f8a,transparent:true,opacity:0});let pupS=1;
const torso=mk(new THREE.CylinderGeometry(.62,.58,3.1,28),shirt,0,-.95,0);
const stripes=[1.15,.75,.35].map(y=>mk(new THREE.CylinderGeometry(.628,.628,.12,28),white,0,y,0,torso));
const sh=mk(new THREE.SphereGeometry(.64,24,14),shirt,0,.55,0);
mk(new THREE.CylinderGeometry(.17,.2,.5,16),skin,0,.85,0);
const hoodG=new THREE.Group();g.add(hoodG);mk(new THREE.TorusGeometry(.27,.1,10,20),shirt,0,.62,0,hoodG).rotation.x=Math.PI/2;mk(new THREE.SphereGeometry(.3,12,10),shirt,0,.75,-.3,hoodG);
